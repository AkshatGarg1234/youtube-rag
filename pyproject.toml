[project]
name = "youtube-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "groq>=1.7.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
youtube-rag = "youtube_rag:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
